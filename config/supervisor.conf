; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:frappe-bench-frappe-web]
command=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/env/bin/gunicorn -b 127.0.0.1:8000 -w 5 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe.app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/logs/web.log
stderr_logfile=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=tyrescart-accounts
environment=PATH="/home/tyrescart-accounts/.local/bin:/home/tyrescart-accounts/.nvm/versions/node/v24.19.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
directory=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/sites
startretries=10


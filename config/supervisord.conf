; Self-contained, user-scoped supervisord instance - no root/system-wide
; registration. This server's one system supervisord runs as root
; (/etc/supervisor/supervisord.conf), which we have no access to. All
; socket/pidfile/log paths below live under this bench's own directory,
; matching how the test server (erp.klever.ae) runs its own supervisord as
; its own unprivileged user.

[unix_http_server]
file=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/config/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/logs/supervisord.log
pidfile=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/config/pids/supervisord.pid
childlogdir=/home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/logs
logfile_maxbytes=50MB
logfile_backups=10

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/config/supervisor.sock

[include]
files = /home/tyrescart-accounts/htdocs/accounts.tyrescart.ae/frappe-bench/config/supervisor.conf
